<div id="ordersScreen" class="screen">
  <!-- PREMIUM ADMIN HEADER -->
  <header class="topBar">
    <div style="display:flex; align-items:center; gap:10px;">
      <button onclick="showScreen('dashboardScreen')" class="icon-btn" style="color:white; font-size:18px;">←</button>
      <div class="brand-name" style="color: white;">Manage Orders</div>
    </div>
    <button onclick="loadAdminOrders()" class="icon-btn" style="color:white; font-size:16px;" title="Refresh Orders">🔄</button>
  </header>

  <div style="padding: 15px; padding-bottom:100px;">
    
    <!-- SEARCH & STATUS FILTER -->
    <div style="display:flex; gap:10px; margin-bottom:12px;">
      <input type="text" id="adminOrderSearch" placeholder="🔍 Search Order ID, Customer, Mobile..." onkeyup="filterAdminOrders()" 
             style="flex:1; padding:12px 15px; border-radius:12px; border:1px solid #ddd; font-size:13px; background:white; box-shadow:var(--shadow);">
      
      <select id="adminOrderStatusFilter" onchange="filterAdminOrders()" 
              style="padding:12px; border-radius:12px; border:1px solid #ddd; font-size:13px; font-weight:700; background:white; box-shadow:var(--shadow); color:#333;">
        <option value="ALL">All Status</option>
        <option value="Order Placed">Order Placed</option>
        <option value="Shipped">Shipped</option>
        <option value="Delivered">Delivered</option>
        <option value="Cancelled">Cancelled</option>
      </select>
    </div>

    <!-- BATCH PARCEL SHIPPING ACTIONS TOOLBAR -->
    <div id="batchOrdersActionBar" style="background:#f0fdf4; border:1px solid #bbf7d0; border-radius:12px; padding:10px 14px; margin-bottom:15px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; box-shadow:var(--shadow);">
       <div style="display:flex; align-items:center; gap:8px;">
          <input type="checkbox" id="selectAllAdminOrders" onchange="toggleSelectAllAdminOrders(this.checked)" style="width:16px; height:16px; cursor:pointer;">
          <label for="selectAllAdminOrders" style="font-size:12px; font-weight:800; color:#166534; cursor:pointer;">Select All Filtered</label>
          <span id="selectedOrdersCountBadge" style="font-size:11px; font-weight:800; background:#166534; color:white; padding:2px 8px; border-radius:12px;">0 Selected</span>
       </div>
       <div style="display:flex; gap:8px;">
          <button onclick="printBatchSelectedParcelBills()" style="background:#0b6e38; color:white; border:none; padding:8px 14px; border-radius:8px; font-weight:800; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:6px; box-shadow:0 2px 6px rgba(11,110,56,0.25);">
             📦 Print Selected Parcel Bills
          </button>
       </div>
    </div>

    <!-- ORDERS LIST CONTAINER -->
    <div id="adminOrdersList" style="display:flex; flex-direction:column; gap:15px;">
      <p style="text-align:center; padding:40px; color:#999;">Loading customer orders...</p>
    </div>

  </div>
</div>
