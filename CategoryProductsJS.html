<script>
let currentSelectedCategoryName = "ALL";
let categoryProductsMasterList = [];

window.openCategoryProductsScreen = function(catName, catImage) {
    currentSelectedCategoryName = catName || "ALL";
    console.log("Opening Category Products Screen for:", currentSelectedCategoryName);

    const titleEl = document.getElementById("catProdHeaderTitle");
    const bannerTitle = document.getElementById("catBannerTitle");
    const bannerImg = document.getElementById("catBannerImg");
    const bannerDesc = document.getElementById("catBannerDesc");

    if (titleEl) titleEl.innerText = (currentSelectedCategoryName === "ALL") ? "All Pickles & Products" : currentSelectedCategoryName;
    if (bannerTitle) bannerTitle.innerText = (currentSelectedCategoryName === "ALL") ? "All Traditional Pickles" : currentSelectedCategoryName;
    
    if (bannerImg) {
        bannerImg.src = catImage || "https://images.unsplash.com/photo-1589927986089-35812388d1f4?w=500";
    }

    showLoading("Loading " + (currentSelectedCategoryName === "ALL" ? "products" : currentSelectedCategoryName) + "...");

    // Fetch categories to render chips row
    server("getAllCategories").then(cats => {
        renderCategoryChips(cats || [], currentSelectedCategoryName);
    }).catch(err => console.warn(err));

    // Fetch products
    server("getAllProducts").then(prods => {
        hideLoading();
        let list = prods || [];

        if (currentSelectedCategoryName !== "ALL") {
            const catUpper = String(currentSelectedCategoryName).toUpperCase().trim();
            if (catUpper === "BEST SELLERS" || catUpper === "BESTSELLERS" || catUpper === "BEST SELLER") {
                list = list.filter(p => p.bestSeller === true || p.bestSeller === "YES" || String(p.bestSeller).toLowerCase() === "true");
            } else if (catUpper === "UNDER ₹50 OFF" || catUpper === "UNDER 50 OFF" || catUpper === "UNDER 50") {
                list = list.filter(p => p.under50Off === true || String(p.under50Off).toLowerCase() === "true" || ((Number(p.mrp || 0) - Number(p.offerPrice || p.price || 0)) >= 50));
            } else if (catUpper === "50% OFF SPECIAL" || catUpper === "50% OFF" || catUpper === "50 PERCENT OFF") {
                list = list.filter(p => p.off50Percent === true || String(p.off50Percent).toLowerCase() === "true" || (p.mrp && ((Number(p.mrp) - Number(p.offerPrice || p.price)) / Number(p.mrp)) >= 0.48));
            } else if (catUpper === "20% OFF SPECIAL" || catUpper === "20% OFF" || catUpper === "20 PERCENT OFF") {
                list = list.filter(p => p.off20Percent === true || String(p.off20Percent).toLowerCase() === "true" || (p.mrp && ((Number(p.mrp) - Number(p.offerPrice || p.price)) / Number(p.mrp)) >= 0.18));
            } else if (catUpper === "NEW ARRIVALS" || catUpper === "NEW ARRIVAL") {
                list = list.filter(p => p.newArrival === true || p.newArrival === "YES" || String(p.newArrival).toLowerCase() === "true");
            } else if (catUpper === "FEATURED") {
                list = list.filter(p => p.featured === true || p.featured === "YES" || String(p.featured).toLowerCase() === "true");
            } else if (catUpper === "SOLAR PRE-ORDER" || catUpper === "PRE-ORDER" || catUpper === "PREORDER") {
                list = list.filter(p => p.preOrder === "YES" || p.isPreOrder === true || String(p.preOrder).toLowerCase() === "true");
            } else if (catUpper === "WHOLESALE BULK" || catUpper === "BULK") {
                list = list.filter(p => p.bulkAvailable === "YES" || p.bulkAvailable === true || String(p.bulkAvailable).toLowerCase() === "true");
            } else {
                list = list.filter(p => p.category && p.category.toLowerCase() === currentSelectedCategoryName.toLowerCase());
            }
        }

        categoryProductsMasterList = list;
        
        const countEl = document.getElementById("catProdHeaderCount");
        if (countEl) countEl.innerText = `${list.length} item(s) available`;

        if (bannerDesc) {
            bannerDesc.innerText = `Explore our authentic ${currentSelectedCategoryName === "ALL" ? "homemade" : currentSelectedCategoryName} pickle selection prepared with pure spices.`;
        }

        filterCatProductsList();
        showScreen("categoryProductsScreen");
    }).catch(err => {
        hideLoading();
        alert("Error loading category products: " + err);
    });
};

function renderCategoryChips(categories, activeName) {
    const chipsRow = document.getElementById("categoryChipsRow");
    if (!chipsRow) return;

    const isActive = (n) => String(n).toLowerCase().trim() === String(activeName).toLowerCase().trim();

    let html = `
    <button onclick="openCategoryProductsScreen('ALL', 'https://images.unsplash.com/photo-1589927986089-35812388d1f4?w=500')" 
            style="padding:6px 12px; border-radius:20px; font-size:11px; font-weight:800; cursor:pointer; white-space:nowrap; border:1px solid #0b6e38; ${isActive('ALL') ? 'background:#0b6e38; color:white;' : 'background:white; color:#0b6e38;'}">
      ✨ All Products
    </button>
    <button onclick="openCategoryProductsScreen('Best Sellers', 'https://images.unsplash.com/photo-1589927986089-35812388d1f4?w=500')" 
            style="padding:6px 12px; border-radius:20px; font-size:11px; font-weight:800; cursor:pointer; white-space:nowrap; border:1px solid #d97706; ${isActive('Best Sellers') ? 'background:#d97706; color:white;' : 'background:white; color:#d97706;'}">
      🔥 Best Sellers
    </button>
    <button onclick="openCategoryProductsScreen('Under ₹50 Off', 'https://images.unsplash.com/photo-1590005354167-6da97870c757?w=500')" 
            style="padding:6px 12px; border-radius:20px; font-size:11px; font-weight:800; cursor:pointer; white-space:nowrap; border:1px solid #dc2626; ${isActive('Under ₹50 Off') ? 'background:#dc2626; color:white;' : 'background:white; color:#dc2626;'}">
      ⚡ Under ₹50 Off
    </button>
    <button onclick="openCategoryProductsScreen('50% Off Special', 'https://images.unsplash.com/photo-1599909631369-02eb644910e5?w=500')" 
            style="padding:6px 12px; border-radius:20px; font-size:11px; font-weight:800; cursor:pointer; white-space:nowrap; border:1px solid #7c3aed; ${isActive('50% Off Special') ? 'background:#7c3aed; color:white;' : 'background:white; color:#7c3aed;'}">
      🎉 50% Off
    </button>
    <button onclick="openCategoryProductsScreen('20% Off Special', 'https://images.unsplash.com/photo-1589927986089-35812388d1f4?w=500')" 
            style="padding:6px 12px; border-radius:20px; font-size:11px; font-weight:800; cursor:pointer; white-space:nowrap; border:1px solid #059669; ${isActive('20% Off Special') ? 'background:#059669; color:white;' : 'background:white; color:#059669;'}">
      💥 20% Off
    </button>
    <button onclick="openCategoryProductsScreen('New Arrivals', 'https://images.unsplash.com/photo-1590005354167-6da97870c757?w=500')" 
            style="padding:6px 12px; border-radius:20px; font-size:11px; font-weight:800; cursor:pointer; white-space:nowrap; border:1px solid #2563eb; ${isActive('New Arrivals') ? 'background:#2563eb; color:white;' : 'background:white; color:#2563eb;'}">
      ✨ New Arrivals
    </button>`;

    const sortedCats = [...(categories || [])].sort((a, b) => (Number(a.priority) || 99) - (Number(b.priority) || 99));
    sortedCats.forEach(c => {
        if (c.status === "INACTIVE") return;
        const icon = c.icon || "🥭";
        const img = c.imageUrl || c.image || "https://images.unsplash.com/photo-1589927986089-35812388d1f4?w=500";
        const isSelected = (c.name.toLowerCase() === activeName.toLowerCase());

        html += `
        <button onclick="openCategoryProductsScreen('${c.name}', '${img}')" 
                style="padding:6px 12px; border-radius:20px; font-size:11px; font-weight:800; cursor:pointer; white-space:nowrap; border:1px solid #0b6e38; ${isSelected ? 'background:#0b6e38; color:white;' : 'background:white; color:#0b6e38;'}">
          ${icon} ${c.name}
        </button>`;
    });

    chipsRow.innerHTML = html;
}

window.filterCatProductsList = function() {
    const searchVal = document.getElementById("catProdSearchInput")?.value.toLowerCase().trim();
    const sortVal = document.getElementById("catProdSortSelect")?.value || "RECOMMENDED";

    let filtered = [...categoryProductsMasterList];

    if (searchVal) {
        filtered = filtered.filter(p => 
            (p.name && p.name.toLowerCase().includes(searchVal)) ||
            (p.description && p.description.toLowerCase().includes(searchVal))
        );
    }

    if (sortVal === "PRICE_LOW") {
        filtered.sort((a,b) => Number(a.offerPrice || a.mrp || 0) - Number(b.offerPrice || b.mrp || 0));
    } else if (sortVal === "PRICE_HIGH") {
        filtered.sort((a,b) => Number(b.offerPrice || b.mrp || 0) - Number(a.offerPrice || a.mrp || 0));
    }

    renderCategoryProductsGrid(filtered);
};

function renderCategoryProductsGrid(products) {
    const grid = document.getElementById("catProductsGrid");
    if (!grid) return;

    if (!products || products.length === 0) {
        grid.innerHTML = `
            <div style="grid-column:1 / -1; text-align:center; padding:40px 20px; background:white; border-radius:18px; border:1px solid #f0f0f0;">
               <div style="font-size:36px; margin-bottom:8px;">🥭</div>
               <h3 style="color:#111827; margin:0 0 4px 0; font-size:14px; font-weight:800;">No products found in this category</h3>
               <p style="color:#64748b; font-size:12px; margin-bottom:12px;">Try selecting another category or clear search terms.</p>
               <button class="primaryButton" onclick="openCategoryProductsScreen('ALL', '')" style="width:auto; padding:8px 16px; font-size:11px;">View All Products</button>
            </div>`;
        return;
    }

    let html = "";
    products.forEach(p => {
        const img = p.image1 || p.image || "https://images.unsplash.com/photo-1589927986089-35812388d1f4?w=500";
        const price = p.offerPrice || p.mrp || 299;
        const mrp = p.mrp && p.mrp > price ? p.mrp : null;
        const isPre = !!(p.preOrder || p.isPreOrder || p.preorder);

        html += `
        <div style="background:white; border-radius:16px; overflow:hidden; box-shadow:var(--shadow); border:1px solid #f0f0f0; display:flex; flex-direction:column; position:relative;">
           
           ${isPre ? `<span style="position:absolute; top:8px; left:8px; background:#0284c7; color:white; font-size:9px; font-weight:800; padding:3px 8px; border-radius:10px; z-index:2;">⏳ Pre-Order</span>` : ''}

           <div onclick="openProduct('${p.id}')" style="height:140px; background:#f8fafc; overflow:hidden; cursor:pointer; position:relative;">
              <img src="${img}" alt="${p.name}" style="width:100%; height:100%; object-fit:cover; transition:transform 0.3s;">
           </div>

           <div style="padding:10px; flex:1; display:flex; flex-direction:column; justify-space-between;">
              <div>
                 <div style="font-size:10px; color:#0b6e38; font-weight:800; text-transform:uppercase;">${p.category || 'Homemade'}</div>
                 <h3 onclick="openProduct('${p.id}')" style="font-size:13px; font-weight:800; color:#0f172a; margin:2px 0 4px 0; line-height:1.3; cursor:pointer; min-height:34px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">
                   ${p.name}
                 </h3>
                 
                 <div style="display:flex; align-items:center; gap:4px; font-size:10px; color:#f59e0b; margin-bottom:6px;">
                    <span>⭐ 4.9</span>
                    <span style="color:#94a3b8;">(100+ Reviews)</span>
                 </div>
              </div>

              <div>
                 <div style="display:flex; align-items:baseline; gap:6px; margin-bottom:8px;">
                    <span style="font-size:15px; font-weight:900; color:#0f172a;">₹${price}</span>
                    ${mrp ? `<span style="font-size:11px; color:#94a3b8; text-decoration:line-through;">₹${mrp}</span>` : ''}
                    <span style="font-size:10px; color:#16a34a; font-weight:800; margin-left:auto;">${p.weight || '500g'}</span>
                 </div>

                 <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
                    <button onclick="openProduct('${p.id}')" class="secondaryButton" style="padding:7px 4px; font-size:11px; font-weight:800; border-radius:10px;">
                       Details
                    </button>
                    <button onclick="quickAddToCart('${p.id}')" class="primaryButton" style="padding:7px 4px; font-size:11px; font-weight:800; border-radius:10px;">
                       + Add
                    </button>
                 </div>
              </div>
           </div>
        </div>`;
    });

    grid.innerHTML = html;
}

window.quickAddToCart = function(productId) {
    const isMaintenance = localStorage.getItem("app_maintenance_mode") === "true";
    if (isMaintenance) {
        alert("⚠️ Store Maintenance Active:\nAaharShree Naturals online cart additions and ordering are currently paused while maintenance is performed by Master Admin.");
        return;
    }

    server("getProductDetails", productId).then(p => {
        if (!p) return;
        const item = {
            id: p.id,
            productId: p.id,
            name: p.name,
            price: p.offerPrice || p.mrp || 299,
            weight: p.weight || '500g',
            image: p.image1 || p.image,
            qty: 1,
            isPreOrder: !!(p.preOrder || p.isPreOrder || p.preorder)
        };
        addToCart(item);
        if (typeof showCartAlert === 'function') {
            showCartAlert(`Added ${p.name} to cart!`);
        } else {
            alert(`🛒 Added ${p.name} to cart!`);
        }
    });
};
</script>
