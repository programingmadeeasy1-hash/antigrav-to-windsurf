<script>
// Global Client-Side Error Catchers for Diagnostic Feedback
function showDiagnosticBanner(message) {
    const banner = document.getElementById('diagnosticBanner');
    if (!banner) return;

    banner.textContent = message;
    banner.style.display = 'block';
    clearTimeout(showDiagnosticBanner.hideTimer);
    showDiagnosticBanner.hideTimer = setTimeout(() => {
        banner.style.display = 'none';
    }, 4000);
}

window.onerror = function(message, source, lineno, colno, error) {
    const errorMsg = `🚨 Unhandled JS Error:\n${message}\nSource: ${source ? source.substring(source.lastIndexOf('/') + 1) : 'unknown'}\nLine: ${lineno}:${colno}`;
    console.error(errorMsg, error);
    showDiagnosticBanner(errorMsg);
    return false;
};

window.onunhandledrejection = function(event) {
    const errorMsg = `🚨 Unhandled Promise Rejection:\n${event.reason}`;
    console.error(errorMsg);
    showDiagnosticBanner(errorMsg);
};

// ======================================================
// GLOBAL APP STATE CONTAINER & SECURITY UTILITIES
// ======================================================
window.escapeHtml = function(str) {
    if (str === null || str === undefined) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
};

function ensureScreenElement(screenId) {
    let element = document.getElementById(screenId);
    if (element) return element;

    const appRoot = document.getElementById('app-root') || document.body;
    element = document.createElement('div');
    element.id = screenId;
    element.className = 'screen';
    element.style.display = 'none';

    const fallbackMarkup = {
        loginScreen: '<div style="padding:24px; max-width:420px; margin:0 auto; text-align:center; font-family:Segoe UI,Arial,sans-serif;"><h1 style="font-size:28px; margin-bottom:12px; color:#0b6e38;">AaharShree</h1><p style="font-size:14px; color:#475569; margin-bottom:16px;">Your app shell is ready. Start by signing in.</p><button style="padding:12px 18px; background:#0b6e38; color:#fff; border:none; border-radius:10px; font-weight:700;">Login</button></div>',
        homeScreen: '<div style="padding:24px; max-width:640px; margin:0 auto; text-align:center; font-family:Segoe UI,Arial,sans-serif;"><h1 style="font-size:26px; margin-bottom:12px; color:#0b6e38;">Home</h1><p style="font-size:14px; color:#475569;">Your store home view is loading.</p></div>',
        dashboardScreen: '<div style="padding:24px; max-width:640px; margin:0 auto; text-align:center; font-family:Segoe UI,Arial,sans-serif;"><h1 style="font-size:26px; margin-bottom:12px; color:#0b6e38;">Dashboard</h1><p style="font-size:14px; color:#475569;">Admin dashboard content is loading.</p></div>'
    };

    element.innerHTML = fallbackMarkup[screenId] || '<div style="padding:24px; font-family:Segoe UI,Arial,sans-serif;">Screen unavailable</div>';
    appRoot.appendChild(element);
    return element;
}

const App = {
    user: null,
    returnToCheckout: false
};

/**
 * Universal Wrapper for google.script.run
 */
function server(functionName, ...args) {
    return new Promise((resolve, reject) => {
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
            console.warn(`[DEV MOCK MODE] Calling ${functionName} with:`, args);
            const mockHandler = (window.handleMockServerCall || (window.parent && window.parent.handleMockServerCall));
            if (typeof mockHandler === 'function') {
                return mockHandler(functionName, args).then(resolve).catch(reject);
            }
            return resolve(null);
        }

        const runner = google.script.run
            .withSuccessHandler(res => resolve(res))
            .withFailureHandler(err => {
                console.error(`[GAS SERVER ERROR] in ${functionName}:`, err);
                reject(err);
            });

        if (typeof runner[functionName] === 'function') {
            runner[functionName](...args);
        } else {
            const errMsg = `Server-side function "${functionName}" is not defined or deployed.`;
            console.error(errMsg);
            reject(new Error(errMsg));
        }
    });
}

/**
 * Universal Data Initializer Per Screen
 */
function triggerScreenInitializer(screenId) {
    const safeRun = (initializerName, initializer) => {
        try {
            if (typeof initializer === 'function') {
                initializer();
                console.log(`[startup] initializer done: ${initializerName} for ${screenId}`);
            }
        } catch (e) {
            console.error(`[startup] initializer failed: ${initializerName} for ${screenId}`, e);
            showDiagnosticBanner(`[startup] initializer failed: ${initializerName} for ${screenId}`);
        }
    };

    try {
        switch (screenId) {
            case 'homeScreen':
                safeRun('loadHome', loadHome);
                break;
            case 'cartScreen':
                if (typeof loadCart === 'function') {
                    safeRun('loadCart', loadCart);
                } else if (typeof showCart === 'function') {
                    safeRun('showCart', showCart);
                }
                break;
            case 'myOrdersScreen':
                safeRun('loadMyOrders', loadMyOrders);
                break;
            case 'profileScreen':
                safeRun('loadProfile', loadProfile);
                break;
            case 'dashboardScreen':
                safeRun('loadDashboard', loadDashboard);
                break;
            case 'ordersScreen':
                safeRun('loadAdminOrders', loadAdminOrders);
                break;
            case 'productsAdminScreen':
                safeRun('loadAdminProducts', loadAdminProducts);
                break;
            case 'inventoryScreen':
                safeRun('loadInventory', loadInventory);
                break;
            case 'customersScreen':
                safeRun('loadCustomers', loadCustomers);
                break;
            case 'settingsScreen':
                safeRun('loadSettings', loadSettings);
                break;
            case 'couponsScreen':
                safeRun('loadCouponsAdmin', loadCouponsAdmin);
                break;
            case 'slidersAdminScreen':
                safeRun('loadAdminSliders', loadAdminSliders);
                break;
            case 'specialOrdersAdminScreen':
                safeRun('loadSpecialAdminData', loadSpecialAdminData);
                break;
            case 'categoriesScreen':
                safeRun('loadAdminCategories', loadAdminCategories);
                break;
            case 'analyticsScreen':
                safeRun('loadAnalytics', loadAnalytics);
                break;
            case 'adminProfileScreen':
                safeRun('loadAdminStaffDirectory', loadAdminStaffDirectory);
                break;
        }
    } catch (e) {
        console.warn("Screen trigger error for " + screenId + ":", e);
        showDiagnosticBanner("Screen trigger error for " + screenId);
    }
}

/**
 * Global Screen Navigation System with Mobile Back Button & Refresh Persistence Support
 */
function showScreen(screenId, pushHistory = true) {
    if (!screenId) return;

    console.log(`[startup] showScreen entered: ${screenId}`);

    ensureScreenElement(screenId);
    ensureScreenElement('loginScreen');
    ensureScreenElement('homeScreen');
    ensureScreenElement('dashboardScreen');

    const fallbackOrder = [screenId, 'loginScreen', 'homeScreen', 'dashboardScreen', 'splashScreen'];
    let target = null;
    let resolvedScreenId = screenId;

    for (const candidate of fallbackOrder) {
        const element = document.getElementById(candidate);
        if (element) {
            target = element;
            resolvedScreenId = candidate;
            break;
        }
    }

    if (!target) {
        console.error("Screen ID not found and no fallback screen is available:", screenId);
        return;
    }

    try {
        document.querySelectorAll('.screen').forEach(s => {
            s.classList.remove('active');
            s.style.display = 'none';
        });

        if (resolvedScreenId !== 'splashScreen') {
            const splashEl = document.getElementById('splashScreen');
            if (splashEl) {
                splashEl.style.opacity = "0";
                splashEl.style.pointerEvents = "none";
                try { splashEl.remove(); } catch(e) {
                    if (splashEl.parentNode) splashEl.parentNode.removeChild(splashEl);
                }
            }
        }
    } catch (e) {}

    try {
        target.classList.add('active');
        target.style.display = (resolvedScreenId === 'splashScreen') ? 'flex' : 'block';
    } catch (e) {}

    console.log(`[startup] target resolved: ${resolvedScreenId} for ${screenId}`);
    window.scrollTo(0, 0);

    // Save to localStorage so screen remains active on page refresh
    try {
        localStorage.setItem("aaharshree_last_screen", screenId);
    } catch(e) {}

    // Push to browser history for Mobile Hardware Back Button support
    if (pushHistory) {
        try {
            const hash = '#' + screenId;
            if (window.location.hash !== hash) {
                history.pushState({ screenId: screenId }, '', hash);
            }
        } catch(e) {}
    }

    // Synchronize bottom nav active state across screens
    updateBottomNavUI(resolvedScreenId);

    // Automatically trigger data refresh / initializer for opened screen after the active class commits
    setTimeout(() => {
        try {
            triggerScreenInitializer(screenId);
        } catch (e) {
            console.error(`[startup] screen initializer dispatch failed for ${screenId}`, e);
        }
    }, 0);
}

// Helper for Bottom Nav
function updateBottomNavUI(screenId) {
    document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
        item.classList.remove('active');
        const attr = item.getAttribute('onclick') || '';
        if (screenId === 'homeScreen' && (attr.includes('homeScreen') || attr.includes('loadHome'))) {
            item.classList.add('active');
        } else if (screenId === 'cartScreen' && attr.includes('showCart')) {
            item.classList.add('active');
        } else if (screenId === 'profileScreen' && attr.includes('openProfile')) {
            item.classList.add('active');
        }
    });
}

// Mobile Hardware Back Button and Browser Navigation Handlers
window.addEventListener('popstate', (event) => {
    let targetScreen = null;
    if (event.state && event.state.screenId) {
        targetScreen = event.state.screenId;
    } else if (window.location.hash) {
        targetScreen = window.location.hash.replace('#', '');
    }

    if (targetScreen && document.getElementById(targetScreen)) {
        showScreen(targetScreen, false);
    } else {
        const user = App.user || (localStorage.getItem("aaharshree_user") ? JSON.parse(localStorage.getItem("aaharshree_user")) : null);
        const isAdmin = !!(user && (user.role === 'ADMIN' || localStorage.getItem("admin")));
        showScreen(isAdmin ? "dashboardScreen" : "homeScreen", false);
    }
});

window.addEventListener('hashchange', () => {
    const hash = window.location.hash.replace('#', '');
    if (hash && document.getElementById(hash)) {
        const currentActive = document.querySelector('.screen.active');
        if (!currentActive || currentActive.id !== hash) {
            showScreen(hash, false);
        }
    }
});

/**
 * Loading Spinner Handlers
 */
function showLoading(msg = "Loading AaharShree...") {
    const loader = document.getElementById("globalLoader");
    const text = document.getElementById("loaderText");
    if (text) text.innerText = msg;
    if (loader) loader.style.display = "flex";
}

function hideLoading() {
    const loader = document.getElementById("globalLoader");
    if (loader) loader.style.display = "none";
}

/**
 * User Logout Utility
 */
function logout() {
    App.user = null;
    localStorage.removeItem("aaharshree_user");
    localStorage.removeItem("customer");
    localStorage.removeItem("admin");
    
    if (typeof updateCartBadge === 'function') updateCartBadge();

    showScreen("loginScreen");
    if (typeof showLoginAlert === 'function') {
        showLoginAlert("Signed out successfully.", true);
    }
}

// Check saved user session & sync maintenance mode on app start
document.addEventListener("DOMContentLoaded", () => {
    console.log("[startup] DOMContentLoaded");

    ensureScreenElement('loginScreen');
    ensureScreenElement('homeScreen');
    ensureScreenElement('dashboardScreen');

    App.user = null;
    try {
        localStorage.removeItem("aaharshree_user");
        localStorage.removeItem("customer");
        localStorage.removeItem("admin");
    } catch(e) {}

    if (typeof updateCartBadge === 'function') updateCartBadge();

    if (!document.querySelector('.screen.active')) {
        setTimeout(() => {
            try {
                showScreen('loginScreen', false);
            } catch (e) {
                console.error('[startup] fallback login bootstrap failed', e);
            }
        }, 0);
    }

    server("getMaintenanceStatus").then(res => {
        console.log("[startup] maintenance-status done");
        if (res && (res.maintenance !== undefined || res.maintenanceMode !== undefined)) {
            const isMaint = !!(res.maintenance || res.maintenanceMode);
            localStorage.setItem("app_maintenance_mode", String(isMaint));
            if (typeof checkCustomerMaintenanceBanner === 'function') checkCustomerMaintenanceBanner();
            if (typeof renderMasterShutdownCard === 'function') renderMasterShutdownCard();
            if (typeof renderSettingsMasterShutdown === 'function') renderSettingsMasterShutdown();
        }
    }).catch(e => {
        console.warn("[startup] maintenance-status failed", e);
    });
});

/**

/**
 * Universal In-App Order Status Notification System
 */
window.userNotifications = [];
window.seenNotifIds = new Set();

window.getUserMobileForNotif = function() {
    try {
        const u = App.user || (localStorage.getItem("aaharshree_user") ? JSON.parse(localStorage.getItem("aaharshree_user")) : null);
        return u ? (u.mobile || u.phone || "") : "";
    } catch(e) {
        return "";
    }
};

window.fetchNotifications = function() {
    const mobile = window.getUserMobileForNotif();
    if (!mobile) {
        window.userNotifications = [];
        const badge = document.getElementById("notifBadge");
        if (badge) badge.style.display = "none";
        return;
    }
    server("getUserNotifications", { mobile: mobile }).then(res => {
        if (!res || !Array.isArray(res.notifications)) return;
        
        window.userNotifications = res.notifications;
        const unreadCount = res.unreadCount || 0;

        // Update Header Badge Counter
        const badge = document.getElementById("notifBadge");
        if (badge) {
            if (unreadCount > 0) {
                badge.innerText = unreadCount > 9 ? "9+" : unreadCount;
                badge.style.display = "flex";
            } else {
                badge.style.display = "none";
            }
        }

        // Check for NEW unread notifications (e.g. status changed from Processing to Shipped)
        res.notifications.forEach(n => {
            if (!n.read && !window.seenNotifIds.has(n.id)) {
                window.seenNotifIds.add(n.id);
                // Trigger Toast Banner if it's a new alert
                window.showInAppStatusToast(n);
            }
        });

        // Re-render list if drawer is currently open
        const drawer = document.getElementById("notificationDrawerOverlay");
        if (drawer && drawer.style.display !== "none") {
            window.renderNotificationList();
        }
    }).catch(err => {
        console.warn("Error fetching notifications:", err);
    });
};

window.toggleNotificationDrawer = function(e) {
    if (e && e.stopPropagation) e.stopPropagation();
    const drawer = document.getElementById("notificationDrawerOverlay");
    if (!drawer) return;

    if (drawer.style.display === "none" || !drawer.style.display) {
        drawer.style.display = "block";
        window.renderNotificationList();
        window.fetchNotifications();
    } else {
        drawer.style.display = "none";
    }
};

window.closeNotificationDrawer = function(e) {
    if (e && e.stopPropagation) e.stopPropagation();
    const drawer = document.getElementById("notificationDrawerOverlay");
    if (drawer) drawer.style.display = "none";
};

window.renderNotificationList = function() {
    const container = document.getElementById("notificationListContainer");
    const countLabel = document.getElementById("notifCountLabel");
    if (!container) return;

    const notifs = window.userNotifications || [];
    if (countLabel) countLabel.innerText = `${notifs.length} Alerts (${notifs.filter(n => !n.read).length} Unread)`;

    if (notifs.length === 0) {
        container.innerHTML = `
        <div style="text-align:center; padding:40px 15px; color:#64748b;">
           <div style="font-size:40px; margin-bottom:10px;">🔔</div>
           <strong style="font-size:14px; color:#0f172a; display:block; margin-bottom:4px;">No Order Alerts Yet</strong>
           <p style="font-size:12px; color:#64748b; margin:0;">We will automatically alert you here as soon as your order status changes to Shipped or Out for Delivery!</p>
        </div>`;
        return;
    }

    let html = "";
    notifs.forEach(n => {
        const isShipped = (n.newStatus === "Shipped" || n.newStatus === "SHIPPED" || n.type === "SHIPPED_ALERT");
        const cardBg = n.read ? "#ffffff" : "#f0fdf4";
        const borderCol = isShipped ? "#bbf7d0" : "#e2e8f0";
        const icon = isShipped ? "🚚" : (n.newStatus === "Delivered" ? "🎉" : "📦");
        const formattedTime = new Date(n.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        html += `
        <div style="background:${cardBg}; border:1px solid ${borderCol}; border-radius:12px; padding:12px 14px; position:relative; box-shadow:0 2px 6px rgba(0,0,0,0.03);">
           <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:8px;">
              <div style="display:flex; align-items:center; gap:8px;">
                 <span style="font-size:20px;">${icon}</span>
                 <div>
                    <div style="font-weight:800; font-size:13px; color:#0f172a;">${n.title || 'Order Update'}</div>
                    <span style="font-size:10px; color:#64748b;">${formattedTime} • Order #${n.orderId}</span>
                 </div>
              </div>
              ${!n.read ? `<span style="background:#16a34a; width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:4px;"></span>` : ''}
           </div>

           <p style="font-size:12px; color:#334155; margin:8px 0; line-height:1.4;">${n.message}</p>

           <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #e2e8f0; padding-top:8px; margin-top:6px;">
              <span style="font-size:11px; font-weight:800; color:#0b6e38; background:#dcfce7; padding:2px 8px; border-radius:6px;">Status: ${n.newStatus}</span>
              <div style="display:flex; gap:8px;">
                 <button onclick="showScreen('myOrdersScreen'); window.closeNotificationDrawer();" style="background:#0b6e38; color:white; border:none; padding:4px 10px; border-radius:6px; font-weight:800; font-size:11px; cursor:pointer;">
                    Track Order
                 </button>
                 ${!n.read ? `<button onclick="window.markSingleNotifRead('${n.id}')" style="background:none; border:none; color:#64748b; font-size:11px; font-weight:700; cursor:pointer;">Dismiss</button>` : ''}
              </div>
           </div>
        </div>`;
    });

    container.innerHTML = html;
};

window.markSingleNotifRead = function(notifId) {
    server("markNotificationRead", notifId).then(() => {
        window.fetchNotifications();
    });
};

window.markAllNotificationsAsRead = function() {
    const mobile = window.getUserMobileForNotif();
    server("markAllNotificationsRead", mobile).then(() => {
        window.fetchNotifications();
    });
};

window.clearAllNotifications = function() {
    const mobile = window.getUserMobileForNotif();
    server("clearNotifications", mobile).then(() => {
        window.fetchNotifications();
    });
};

window.showInAppStatusToast = function(notif) {
    const toast = document.getElementById("inAppStatusToast");
    const titleEl = document.getElementById("toastTitle");
    const msgEl = document.getElementById("toastMessage");
    const iconBox = document.getElementById("toastIconBox");
    if (!toast) return;

    if (titleEl) titleEl.innerText = notif.title || "Order Status Alert!";
    if (msgEl) msgEl.innerText = notif.message || `Order #${notif.orderId} status changed to ${notif.newStatus}`;
    if (iconBox) iconBox.innerText = (notif.newStatus === "Shipped" || notif.type === "SHIPPED_ALERT") ? "🚚" : "📦";

    toast.style.display = "block";

    // Auto close toast after 8 seconds
    if (window._toastTimer) clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => {
        window.closeInAppToast();
    }, 8000);
};

window.closeInAppToast = function() {
    const toast = document.getElementById("inAppStatusToast");
    if (toast) toast.style.display = "none";
};

// Initial Notifications Fetch & Polling setup
document.addEventListener("DOMContentLoaded", function() {
    setTimeout(window.fetchNotifications, 1000);
    setInterval(window.fetchNotifications, 12000);
});

// ======================================================
window.currentVisionTopicId = 'zero-preservatives';
window.visionPillsCache = null;

window.openVisionBlogModal = function(topicId) {
    if (topicId) window.currentVisionTopicId = topicId;
    const overlay = document.getElementById("visionBlogModalOverlay");
    if (overlay) overlay.style.display = "flex";
    
    window.loadAndRenderVisionBlog();
};

window.closeVisionBlogModal = function() {
    const overlay = document.getElementById("visionBlogModalOverlay");
    if (overlay) overlay.style.display = "none";
};

window.switchVisionBlogTopic = function(topicId) {
    window.currentVisionTopicId = topicId;
    window.renderVisionBlogTopic(topicId);
};

window.loadAndRenderVisionBlog = function() {
    server("getVisionPillsData").then(data => {
        if (data) {
            window.visionPillsCache = data;
            window.renderVisionBlogTopic(window.currentVisionTopicId);
        }
    }).catch(err => {
        console.error("Error loading vision pills data:", err);
    });
};

window.renderVisionBlogTopic = function(topicId) {
    const data = window.visionPillsCache ? window.visionPillsCache[topicId] : null;
    if (!data) return;

    // Highlight active tab
    document.querySelectorAll(".vpill-tab").forEach(tab => {
        if (tab.getAttribute("data-id") === topicId) {
            tab.style.background = "#0b6e38";
            tab.style.color = "#ffffff";
            tab.style.borderColor = "#0b6e38";
        } else {
            tab.style.background = "#ffffff";
            tab.style.color = "#334155";
            tab.style.borderColor = "#cbd5e1";
        }
    });

    const headerIcon = document.getElementById("visionModalHeaderIcon");
    const badge = document.getElementById("visionModalBadge");
    const title = document.getElementById("visionModalTitle");
    const subtitle = document.getElementById("visionModalSubtitle");
    const commText = document.getElementById("visionModalCommercialText");
    const aaharText = document.getElementById("visionModalAaharshreeText");
    const bodyText = document.getElementById("visionModalBodyText");
    const highlightsList = document.getElementById("visionModalHighlightsList");

    if (headerIcon) headerIcon.innerText = data.icon || "🌿";
    if (badge) badge.innerText = data.badge || "100% Chemical-Free";
    if (title) title.innerText = data.title || "Our Vision";
    if (subtitle) subtitle.innerText = data.subtitle || "";
    if (commText) commText.innerText = data.commercialReality || "";
    if (aaharText) aaharText.innerText = data.aaharshreeVision || "";
    if (bodyText) bodyText.innerText = data.bodyText || "";

    if (highlightsList && Array.isArray(data.highlights)) {
        highlightsList.innerHTML = data.highlights.map(h => {
            const isNegative = h.startsWith("❌");
            const bg = isNegative ? "#fff5f5" : "#f0fdf4";
            const border = isNegative ? "#fee2e2" : "#bbf7d0";
            const text = isNegative ? "#991b1b" : "#166534";
            return `<div style="background:${bg}; border:1px solid ${border}; padding:8px 12px; border-radius:10px; font-size:12px; font-weight:700; color:${text}; line-height:1.4;">
                ${h}
            </div>`;
        }).join("");
    }
};

window.artisanStoryCache = null;

window.openArtisanHeritageModal = function() {
    const overlay = document.getElementById("artisanHeritageModalOverlay");
    if (overlay) overlay.style.display = "flex";
    window.loadAndRenderArtisanStory();
};

window.closeArtisanHeritageModal = function() {
    const overlay = document.getElementById("artisanHeritageModalOverlay");
    if (overlay) overlay.style.display = "none";
};

window.loadAndRenderArtisanStory = function() {
    server("getArtisanHeritageStory").then(data => {
        if (data) {
            window.artisanStoryCache = data;
            window.renderArtisanStory(data);
        }
    }).catch(err => {
        console.error("Error loading artisan story:", err);
    });
};

window.renderArtisanStory = function(data) {
    if (!data) return;

    const badge = document.getElementById("artisanHeroBadge");
    const title = document.getElementById("artisanTitle");
    const subtitle = document.getElementById("artisanSubtitle");
    const intro = document.getElementById("artisanIntroStory");
    const vowsGrid = document.getElementById("artisanVowsGrid");
    const profilesList = document.getElementById("artisanProfilesList");
    const notesFeed = document.getElementById("artisanNotesFeed");

    if (badge && data.heroBadge) badge.innerText = data.heroBadge;
    if (title && data.title) title.innerText = data.title;
    if (subtitle && data.subtitle) subtitle.innerText = data.subtitle;
    if (intro && data.introStory) intro.innerText = data.introStory;

    // Render Vows Grid
    if (vowsGrid && Array.isArray(data.kitchenVows)) {
        vowsGrid.innerHTML = data.kitchenVows.map(v => `
            <div style="background:#fff7ed; border:1px solid #ffedd5; border-radius:12px; padding:10px 12px;">
                <div style="font-size:12px; font-weight:900; color:#9a3412; display:flex; align-items:center; gap:6px; margin-bottom:4px;">
                    <span>${v.icon}</span> ${v.title}
                </div>
                <div style="font-size:11px; color:#c2410c; line-height:1.4;">${v.desc}</div>
            </div>
        `).join("");
    }

    // Render Artisan Profiles List
    if (profilesList && Array.isArray(data.artisanProfiles)) {
        profilesList.innerHTML = data.artisanProfiles.map(p => `
            <div style="display:flex; gap:14px; background:#fff1f2; border:1px solid #ffe4e6; border-radius:16px; padding:14px; align-items:flex-start;">
                <img src="${p.image}" alt="${p.name}" style="width:58px; height:58px; border-radius:50%; object-fit:cover; border:2px solid #fecdd3; flex-shrink:0;">
                <div style="flex:1;">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <h5 style="margin:0; font-size:14px; font-weight:900; color:#9f1239;">${p.name}</h5>
                        <span style="font-size:10px; font-weight:800; background:#ffffff; color:#be123c; padding:2px 8px; border-radius:8px;">${p.experience}</span>
                    </div>
                    <div style="font-size:11px; font-weight:800; color:#be123c; margin:2px 0 6px 0;">${p.role}</div>
                    <blockquote style="margin:0; font-size:12px; font-style:italic; color:#881337; line-height:1.4; background:rgba(255,255,255,0.6); padding:8px 10px; border-radius:10px; border-left:3px solid #be123c;">
                        "${p.quote}"
                    </blockquote>
                </div>
            </div>
        `).join("");
    }

    // Render Customer Gratitude Notes Feed
    if (notesFeed && Array.isArray(data.gratitudeNotes)) {
        if (data.gratitudeNotes.length === 0) {
            notesFeed.innerHTML = `<div style="font-size:11px; color:#94a3b8; text-align:center; padding:10px;">Be the first customer to send a sweet love note!</div>`;
        } else {
            notesFeed.innerHTML = data.gratitudeNotes.map(n => `
                <div style="background:white; border:1px solid #e2e8f0; border-radius:10px; padding:10px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                        <span style="font-size:11px; font-weight:800; color:#0f172a;">${n.customerName} <small style="color:#64748b;">(${n.location || 'India'})</small></span>
                        <span style="font-size:9px; color:#94a3b8;">${n.date}</span>
                    </div>
                    <p style="margin:0; font-size:11px; color:#334155; line-height:1.4;">"${n.message}"</p>
                </div>
            `).join("");
        }
    }
};

window.submitArtisanGratitudeNote = function() {
    const authorEl = document.getElementById("artisanNoteAuthor");
    const locEl = document.getElementById("artisanNoteLocation");
    const textEl = document.getElementById("artisanNoteText");

    if (!authorEl || !textEl || !textEl.value.trim()) return;

    const payload = {
        customerName: authorEl.value.trim(),
        location: locEl ? locEl.value.trim() : "",
        message: textEl.value.trim()
    };

    server("addArtisanGratitudeNote", payload).then(res => {
        if (res && res.success) {
            alert("Thank you! Your heartwarming note has been shared with our village kitchen mothers! ❤️");
            textEl.value = "";
            if (res.notes && window.artisanStoryCache) {
                window.artisanStoryCache.gratitudeNotes = res.notes;
                window.renderArtisanStory(window.artisanStoryCache);
            }
        }
    }).catch(err => {
        console.error("Error submitting gratitude note:", err);
    });
};
