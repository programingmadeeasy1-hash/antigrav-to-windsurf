<div id="inventoryScreen" class="screen">
  <!-- PREMIUM ADMIN HEADER -->
  <header class="topBar">
    <div style="display:flex; align-items:center; gap:10px;">
      <button onclick="showScreen('dashboardScreen')" class="icon-btn" style="color:white; font-size:18px;">←</button>
      <div class="brand-name" style="color: white;">Stock & Inventory</div>
    </div>
    <button onclick="loadInventory()" class="icon-btn" style="color:white; font-size:16px;" title="Refresh Inventory">🔄</button>
  </header>

  <div style="padding: 15px; padding-bottom:100px;">
    
    <!-- SEARCH BAR -->
    <div style="margin-bottom:15px;">
      <input type="text" id="inventorySearch" placeholder="🔍 Search product or category..." onkeyup="filterInventoryTable()" 
             style="width:100%; padding:12px 15px; border-radius:12px; border:1px solid #ddd; font-size:14px; background:white; box-shadow:var(--shadow);">
    </div>

    <!-- INVENTORY TABLE CONTAINER -->
    <div style="background:white; border-radius:18px; padding:15px; box-shadow:var(--shadow); overflow-x:auto;">
      <table style="width:100%; border-collapse:collapse; text-align:left; font-size:13px;">
        <thead>
          <tr style="border-bottom:2px solid #f0f0f0; color:var(--primary); font-weight:800;">
            <th style="padding:10px 5px;">Product</th>
            <th style="padding:10px 5px; text-align:center;">Weight</th>
            <th style="padding:10px 5px; text-align:center;">Price</th>
            <th style="padding:10px 5px; text-align:center;">Stock</th>
            <th style="padding:10px 5px; text-align:right;">Action</th>
          </tr>
        </thead>
        <tbody id="inventoryTableBody">
          <tr>
            <td colspan="5" style="text-align:center; padding:30px; color:#999;">Loading stock details...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
