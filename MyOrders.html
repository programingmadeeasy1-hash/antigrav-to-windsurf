<div id="myOrdersScreen" class="screen">
  <!-- TOP BAR -->
  <header class="topBar">
    <div style="display:flex; align-items:center; gap:10px;">
      <button onclick="showScreen('homeScreen')" class="icon-btn" style="color:white; font-size:18px;">←</button>
      <div class="brand-name" style="color: white;">My Order History</div>
    </div>
    <button onclick="loadMyOrders()" class="icon-btn" style="color:white; font-size:16px;" title="Refresh Orders">🔄</button>
  </header>

  <div style="padding: 15px; padding-bottom: 100px;">
    
    <!-- ORDER LIST CONTAINER -->
    <div id="myOrdersList" style="display:flex; flex-direction:column; gap:15px;">
      <p style="text-align:center; padding:40px; color:#999;">Fetching your orders...</p>
    </div>

  </div>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">
    <button class="nav-item" onclick="showScreen('homeScreen'); loadHome();"><span>🏠</span>Home</button>
    <button class="nav-item" onclick="showCart()"><span>🛒</span>Cart</button>
    <button class="nav-item active" onclick="openProfile()"><span>👤</span>Profile</button>
  </nav>
</div>
