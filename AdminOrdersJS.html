<script>
function loadAdminOrders() {
    showLoading();
    // Assuming a backend function 'getAllOrders' exists in OrderManager.gs
    server("getAllOrders").then(orders => {
        hideLoading();
        let html = "";
        orders.reverse().forEach(o => {
            html += `
            <div class="adminOrderCard">
                <div style="display:flex; justify-content:space-between;">
                    <b>Order #${o.id}</b>
                    <span class="status-badge">${o.status}</span>
                </div>
                <p>${o.customerName} (${o.mobile})</p>
                <p style="font-size:12px; color:#666;">${o.address}</p>
                <hr>
                <div style="margin-top:10px; font-weight:bold;">Total: ₹${o.total}</div>
            </div>`;
        });
        $("adminOrderList").innerHTML = html;
    });
}
</script>
