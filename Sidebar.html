        <button onclick="closeSidebar(); openProfile();" style="width:100%; padding:11px 12px; text-align:left; background:none; border:none; font-weight:800; font-size:13px; color:#1e293b; border-bottom:1px solid #f1f5f9; display:flex; align-items:center; gap:10px; cursor:pointer;">

        <button onclick="closeSidebar(); openCustomerSupportModal();" style="width:100%; padding:11px 12px; text-align:left; background:none; border:none; font-weight:800; font-size:13px; color:#0284c7; border-bottom:1px solid #f1f5f9; display:flex; align-items:center; gap:10px; cursor:pointer;">

          <span style="font-size:16px;">💬</span> Customer Reviews Moderation

        <button id="sbAdminCouponsLink" onclick="closeSidebar(); openCouponsAdmin();" style="width:100%; padding:11px 12px; text-align:left; background:#fffbeb; border:none; font-weight:800; font-size:13px; color:#b45309; border-bottom:1px solid #fef3c7; display:flex; align-items:center; gap:10px; cursor:pointer;">
          <span style="font-size:16px;">🎟️</span> Coupon & Promo Code Generator
        </button>

     </div>

     <!-- FOOTER INFO -->
     <div style="padding:14px; background:#f8fafc; border-top:1px solid #e2e8f0; font-size:10px; color:#64748b; text-align:center;">
        <div>AaharShree Homemade Pickles App</div>
        <div style="font-weight:700; color:#0b6e38; margin-top:2px;">100% Chemical-Free & Pure 🌿</div>
     </div>

  </div>
</div>

<!-- CUSTOMER SUPPORT & FAQS MODAL -->
<div id="custSupportModalOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:999999; backdrop-filter:blur(4px); justify-content:center; align-items:center; padding:15px;">
   <div style="background:white; width:100%; max-width:480px; max-height:88vh; border-radius:24px; box-shadow:0 20px 40px rgba(0,0,0,0.3); display:flex; flex-direction:column; overflow:hidden;">
      
      <!-- MODAL HEADER -->
      <div style="background:linear-gradient(135deg, #0b6e38 0%, #15803d 100%); padding:18px; color:white; display:flex; justify-content:space-between; align-items:center;">
         <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-size:24px;">💬</span>
            <div>
               <h3 style="margin:0; font-size:16px; font-weight:900;">Customer Support & FAQs</h3>
               <p style="margin:0; font-size:11px; color:#bbf7d0;">How can we help you today?</p>
            </div>
         </div>
         <button onclick="closeCustomerSupportModal()" style="background:rgba(255,255,255,0.2); border:none; color:white; width:30px; height:30px; border-radius:50%; font-size:14px; font-weight:bold; cursor:pointer;">✕</button>
      </div>

      <!-- MODAL BODY CONTENT -->
      <div style="padding:16px; overflow-y:auto; flex:1;" id="custSupportModalBody">
         <p style="text-align:center; color:#94a3b8; font-size:12px; padding:20px;">Loading customer support details...</p>
      </div>

      <!-- MODAL FOOTER -->
      <div style="padding:12px 16px; background:#f8fafc; border-top:1px solid #e2e8f0; text-align:center;">
         <button onclick="closeCustomerSupportModal()" class="primaryButton" style="padding:9px 20px; font-size:12px; font-weight:800; border-radius:12px;">Close Support Window</button>
      </div>
   </div>
</div>

<script>
function openSidebar() { 
    document.getElementById("sidebarOverlay").style.display = "block";
    updateSidebarUserHeader();
    loadSidebarCategories();
    loadSidebarMenuItems();
}

function closeSidebar() { 
    document.getElementById("sidebarOverlay").style.display = "none"; 
}

function updateSidebarUserHeader() {
    const user = App.user;
    const nameEl = document.getElementById("sbUserName");
    const subEl = document.getElementById("sbUserSub");

    if (user) {
        if (nameEl) nameEl.innerText = user.name || "Customer Account";
        if (subEl) subEl.innerText = user.mobile ? "📱 +91 " + user.mobile : (user.email || "Logged In");
    } else {
        if (nameEl) nameEl.innerText = "Welcome, Guest Customer";
        if (subEl) subEl.innerText = "Tap profile to sign in";
    }
}

function toggleSidebarCategoryAccordion() {
    const dropdown = document.getElementById("sidebarCategoriesDropdown");
    const arrow = document.getElementById("sbCatArrow");
    if (!dropdown) return;
    
    if (dropdown.style.display === "none") {
        dropdown.style.display = "block";
        if (arrow) arrow.style.transform = "rotate(0deg)";
    } else {
        dropdown.style.display = "none";
        if (arrow) arrow.style.transform = "rotate(-90deg)";
    }
}

function loadSidebarMenuItems() {
    const menuContainer = document.getElementById("sbDynamicMenuContainer");
    if (!menuContainer) return;

    server("getSidebarConfig").then(items => {
        if (!items || !Array.isArray(items) || items.length === 0) return;

        const activeItems = items.filter(i => i.active !== false);
        let html = "";

        activeItems.forEach(item => {
            const icon = item.icon || "📌";
            const label = item.label || "Menu Item";
            const target = item.target || "homeScreen";

            if (target === "categories") {
                html += `
                <div style="border-bottom:1px solid #f1f5f9;">
                   <button onclick="toggleSidebarCategoryAccordion()" style="width:100%; padding:11px 12px; text-align:left; background:none; border:none; font-weight:800; font-size:13px; color:#0b6e38; display:flex; justify-content:space-between; align-items:center; cursor:pointer;">
                      <div style="display:flex; align-items:center; gap:10px;">
                        <span style="font-size:16px;">${icon}</span> 
                        <span>${label}</span>
                      </div>
                      <span id="sbCatArrow" style="font-size:12px; transition:transform 0.2s;">▼</span>
                   </button>
                   <div id="sidebarCategoriesDropdown" style="display:block; background:#f8fafc; border-radius:10px; margin:4px 6px 10px 6px; padding:6px 0; border:1px solid #e2e8f0;">
                      <div id="sbCategoriesList" style="display:flex; flex-direction:column; gap:2px;">
                         <div style="padding:10px 14px; font-size:11px; color:#94a3b8;">Loading categories...</div>
                      </div>
                   </div>
                </div>`;
            } else if (target === "homeScreen") {
                html += `
                <button onclick="closeSidebar(); showScreen('homeScreen'); loadHome();" style="width:100%; padding:11px 12px; text-align:left; background:none; border:none; font-weight:800; font-size:13px; color:#1e293b; border-bottom:1px solid #f1f5f9; display:flex; align-items:center; gap:10px; cursor:pointer;">
                  <span style="font-size:16px;">${icon}</span> ${label}
                </button>`;
            } else if (target === "orders") {
                html += `
                <button onclick="closeSidebar(); openProfile(); switchCustProfileTab('orders');" style="width:100%; padding:11px 12px; text-align:left; background:none; border:none; font-weight:800; font-size:13px; color:#1e293b; border-bottom:1px solid #f1f5f9; display:flex; align-items:center; gap:10px; cursor:pointer;">
                  <span style="font-size:16px;">${icon}</span> ${label}
                </button>`;
            } else if (target === "preorders") {
                html += `
                <button onclick="closeSidebar(); openProfile(); switchCustProfileTab('preorders');" style="width:100%; padding:11px 12px; text-align:left; background:none; border:none; font-weight:800; font-size:13px; color:#1e293b; border-bottom:1px solid #f1f5f9; display:flex; align-items:center; gap:10px; cursor:pointer;">
                  <span style="font-size:16px;">${icon}</span> ${label}
                </button>`;
            } else if (target === "bulk") {
                html += `
                <button onclick="closeSidebar(); openProfile(); switchCustProfileTab('bulk');" style="width:100%; padding:11px 12px; text-align:left; background:none; border:none; font-weight:800; font-size:13px; color:#1e293b; border-bottom:1px solid #f1f5f9; display:flex; align-items:center; gap:10px; cursor:pointer;">
                  <span style="font-size:16px;">${icon}</span> ${label}
                </button>`;
            } else if (target === "cart") {
                html += `
                <button onclick="closeSidebar(); showCart();" style="width:100%; padding:11px 12px; text-align:left; background:none; border:none; font-weight:800; font-size:13px; color:#1e293b; border-bottom:1px solid #f1f5f9; display:flex; align-items:center; gap:10px; cursor:pointer;">
                  <span style="font-size:16px;">${icon}</span> ${label}
                </button>`;
            } else if (target === "profile") {
                html += `
                <button onclick="closeSidebar(); openProfile();" style="width:100%; padding:11px 12px; text-align:left; background:none; border:none; font-weight:800; font-size:13px; color:#1e293b; border-bottom:1px solid #f1f5f9; display:flex; align-items:center; gap:10px; cursor:pointer;">
                  <span style="font-size:16px;">${icon}</span> ${label}
                </button>`;
            } else if (target === "coupons" || target === "couponsScreen") {
                html += `
                <button onclick="closeSidebar(); showScreen('couponsScreen'); loadCouponsAdmin();" style="width:100%; padding:11px 12px; text-align:left; background:none; border:none; font-weight:800; font-size:13px; color:#b45309; border-bottom:1px solid #f1f5f9; display:flex; align-items:center; gap:10px; cursor:pointer;">
                  <span style="font-size:16px;">🏷️</span> Coupons & Rewards
                </button>`;
            } else if (target === "support") {
                html += `
                <button onclick="closeSidebar(); openCustomerSupportModal();" style="width:100%; padding:11px 12px; text-align:left; background:none; border:none; font-weight:800; font-size:13px; color:#0284c7; border-bottom:1px solid #f1f5f9; display:flex; align-items:center; gap:10px; cursor:pointer;">
                  <span style="font-size:16px;">${icon}</span> ${label}
                </button>`;
            }
        });

        menuContainer.innerHTML = html;
        loadSidebarCategories();
    }).catch(err => {
        console.warn("Error loading sidebar config:", err);
    });
}

function loadSidebarCategories() {
    const listEl = document.getElementById("sbCategoriesList");
    if (!listEl) return;

    server("getAllCategories").then(cats => {
        const activeCats = (cats || []).filter(c => c.status !== "INACTIVE")
                                      .sort((a, b) => (Number(a.priority) || 99) - (Number(b.priority) || 99));
        
        if (!activeCats || activeCats.length === 0) {
            listEl.innerHTML = `<div style="padding:8px 12px; font-size:11px; color:#94a3b8;">No categories active</div>`;
            return;
        }

        let html = "";
        activeCats.forEach(c => {
            const icon = c.icon || "🥭";
            const imgUrl = c.imageUrl || c.image || "https://images.unsplash.com/photo-1589927986089-35812388d1f4?w=500";
            
            html += `
            <button onclick="closeSidebar(); openCategoryProductsScreen('${c.name}', '${imgUrl}')" 
                    style="width:100%; text-align:left; background:none; border:none; padding:8px 12px; font-size:12px; font-weight:700; color:#334155; display:flex; align-items:center; justify-content:space-between; cursor:pointer; border-bottom:1px solid #f1f5f9;">
               <div style="display:flex; align-items:center; gap:8px;">
                  <span style="font-size:14px;">${icon}</span>
                  <span>${c.name}</span>
               </div>
               <span style="font-size:10px; color:#0b6e38; font-weight:800;">View →</span>
            </button>`;
        });

        html += `
        <button onclick="closeSidebar(); openCategoryProductsScreen('ALL', '')" 
                style="width:100%; text-align:center; background:#0b6e38; color:white; border:none; padding:8px 12px; font-size:11px; font-weight:800; border-radius:8px; margin-top:4px; cursor:pointer;">
           📦 View All Products & Categories
        </button>`;

        listEl.innerHTML = html;
    }).catch(err => {
        if (listEl) listEl.innerHTML = `<div style="padding:8px 12px; font-size:11px; color:red;">Failed to load categories</div>`;
    });
}

function openCustomerSupportModal() {
    const modal = document.getElementById("custSupportModalOverlay");
    const body = document.getElementById("custSupportModalBody");
    if (modal) modal.style.display = "flex";

    if (body) {
        body.innerHTML = `<p style="text-align:center; color:#94a3b8; font-size:12px; padding:20px;">Fetching helpline & FAQ details...</p>`;
    }

    server("getSupportFaqs").then(data => {
        data = data || {};
        const phone = data.phone || "+91 98765 43210";
        const whatsapp = data.whatsapp || phone;
        const email = data.email || "support@aaharshreenaturals.com";
        const address = data.address || "AaharShree Natural Kitchens, Pune, Maharashtra";
        const hours = data.workingHours || "Mon - Sat: 9:00 AM - 8:00 PM IST";
        const faqs = (data.faqs || []).filter(f => f.status !== "INACTIVE");

        let faqHtml = "";
        if (faqs.length === 0) {
            faqHtml = `<p style="color:#94a3b8; font-size:12px; text-align:center;">No FAQs available right now.</p>`;
        } else {
            faqs.forEach((f, idx) => {
                faqHtml += `
                <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:14px; padding:12px; margin-bottom:8px;">
                   <div style="font-size:13px; font-weight:800; color:#0f172a; margin-bottom:4px; display:flex; gap:6px;">
                      <span style="color:#0b6e38;">Q${idx+1}.</span>
                      <span>${f.question}</span>
                   </div>
                   <div style="font-size:12px; color:#475569; line-height:1.5; padding-left:22px; border-left:2px solid #bbf7d0;">
                      ${f.answer}
                   </div>
                </div>`;
            });
        }

        if (body) {
            body.innerHTML = `
            <!-- CONTACT HELPLINE CARDS -->
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;">
               <a href="tel:${phone.replace(/\s+/g,'')}" style="text-decoration:none; background:#f0fdf4; border:1px solid #bbf7d0; border-radius:16px; padding:12px; text-align:center; color:#166534; display:block;">
                  <div style="font-size:20px; margin-bottom:4px;">📞</div>
                  <div style="font-size:12px; font-weight:800;">Phone Call</div>
                  <div style="font-size:10px; opacity:0.8; margin-top:2px;">${phone}</div>
               </a>
               <a href="https://wa.me/${whatsapp.replace(/\D/g,'')}" target="_blank" style="text-decoration:none; background:#ecfdf5; border:1px solid #a7f3d0; border-radius:16px; padding:12px; text-align:center; color:#047857; display:block;">
                  <div style="font-size:20px; margin-bottom:4px;">💬</div>
                  <div style="font-size:12px; font-weight:800;">WhatsApp Chat</div>
                  <div style="font-size:10px; opacity:0.8; margin-top:2px;">Instant Reply</div>
               </a>
            </div>

            <div style="background:#f8fafc; border-radius:16px; padding:12px; border:1px solid #e2e8f0; margin-bottom:16px; font-size:11px; color:#475569;">
               <div style="margin-bottom:4px;"><strong>✉️ Email Support:</strong> ${email}</div>
               <div style="margin-bottom:4px;"><strong>⏰ Kitchen Hours:</strong> ${hours}</div>
               <div><strong>📍 Address:</strong> ${address}</div>
            </div>

            <!-- FAQS SECTION -->
            <div style="border-top:1px solid #f1f5f9; padding-top:12px;">
               <h4 style="font-size:13px; font-weight:900; color:#111827; margin:0 0 10px 0; display:flex; align-items:center; gap:6px;">
                 <span>❓</span> Frequently Asked Questions (FAQs)
               </h4>
               ${faqHtml}
            </div>`;
        }
    }).catch(err => {
        if (body) body.innerHTML = `<p style="color:red; font-size:12px; text-align:center;">Failed to load support information.</p>`;
    });
}

function closeCustomerSupportModal() {
    const modal = document.getElementById("custSupportModalOverlay");
    if (modal) modal.style.display = "none";
}
</script>
